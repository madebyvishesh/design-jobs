name: Refresh Job Listings

on:
  schedule:
    # Every 30 minutes, at :05 and :35 past the hour (UTC)
    - cron: '5,35 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch all jobs and write to Vercel Blob
        run: npx tsx scripts/fetch-and-cache.ts
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
