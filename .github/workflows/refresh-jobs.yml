name: Refresh Job Listings

on:
  schedule:
    # Every 30 minutes, at :05 and :35 past the hour (UTC)
    - cron: '5,35 * * * *'
    # Renew the schedule before GitHub's 60-day inactivity cutoff.
    - cron: '17 3 1,15 * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  refresh:
    if: github.event.schedule != '17 3 1,15 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch all jobs and write to Vercel Blob
        run: npx tsx scripts/fetch-and-cache.ts
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

  renew-schedule:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 1,15 * *'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Renew the job listings schedule
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/refresh-jobs.yml/enable"
